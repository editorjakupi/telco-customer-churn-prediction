# Keep Streamlit Cloud awake (always-reachable) by pinging the public app URL.
name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit app
        run: |
          set -euo pipefail
          URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://telco-customer-churn-prediction-editorjakupi.streamlit.app/"
          fi
          echo "Pinging $URL"
          code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || true)
          echo "HTTP $code"
          case "$code" in
            2*|3*) exit 0 ;;
            *) echo "Unexpected status"; exit 1 ;;
          esac
