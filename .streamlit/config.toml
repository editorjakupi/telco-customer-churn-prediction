# Dark base so Streamlit widgets stay readable even if custom CSS inject lags.
# In-app Light/Dark still overrides via parent CSS.

[theme]
base = "dark"
primaryColor = "#5eead4"
backgroundColor = "#060b14"
secondaryBackgroundColor = "#121a2b"
textColor = "#e8eef8"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
